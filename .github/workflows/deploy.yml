name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      # Se quiser deploy 100% automático para a Hostinger via FTP:
      # Preencha nos Secrets do GitHub:
      # FTP_SERVER (ex: ftp.seudominio.com.br ou IP da Hostinger)
      # FTP_USERNAME (usuário FTP da Hostinger)
      # FTP_PASSWORD (senha FTP da Hostinger)
      - name: Deploy via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.FTP_SERVER != ''
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
